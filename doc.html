<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>装修执行文档</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20201d;
        --muted: #68645d;
        --line: #d9d4ca;
        --paper: #f5f0e7;
        --panel: #fffdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 54px;
      }

      a {
        color: inherit;
      }

      .back {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--panel);
        text-decoration: none;
      }

      article {
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 24px;
      }

      h1,
      h2,
      h3 {
        line-height: 1.2;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 9px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #ece4d7;
      }

      code {
        background: #eee7dc;
        border-radius: 5px;
        padding: 2px 5px;
      }

      pre {
        overflow: auto;
        background: #eee7dc;
        border-radius: 8px;
        padding: 14px;
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="index.html">返回方案网站</a>
      <article id="content">
        <p class="muted">正在加载文档...</p>
      </article>
    </main>

    <script>
      const allowed = new Set([
        "README.md",
        "room-by-room-spec.md",
        "vendor-brief.md",
        "measurement-checklist.md",
        "acceptance-checklist.md",
        "procurement-shortlist.md"
      ]);

      const params = new URLSearchParams(location.search);
      const file = params.get("file") || "README.md";
      const content = document.querySelector("#content");

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const html = [];
        let inList = false;
        let inTable = false;

        const closeList = () => {
          if (inList) html.push("</ul>");
          inList = false;
        };

        const closeTable = () => {
          if (inTable) html.push("</tbody></table>");
          inTable = false;
        };

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];

          if (/^\s*$/.test(line)) {
            closeList();
            closeTable();
            continue;
          }

          if (line.startsWith("```")) {
            closeList();
            closeTable();
            const code = [];
            index += 1;
            while (index < lines.length && !lines[index].startsWith("```")) {
              code.push(lines[index]);
              index += 1;
            }
            html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
            continue;
          }

          if (line.startsWith("# ")) {
            closeList();
            closeTable();
            html.push(`<h1>${escapeHtml(line.slice(2))}</h1>`);
            continue;
          }

          if (line.startsWith("## ")) {
            closeList();
            closeTable();
            html.push(`<h2>${escapeHtml(line.slice(3))}</h2>`);
            continue;
          }

          if (line.startsWith("### ")) {
            closeList();
            closeTable();
            html.push(`<h3>${escapeHtml(line.slice(4))}</h3>`);
            continue;
          }

          if (line.startsWith("|") && line.endsWith("|")) {
            closeList();
            const cells = line.split("|").slice(1, -1).map((cell) => escapeHtml(cell.trim()));
            const next = lines[index + 1] || "";
            if (!inTable) {
              html.push("<table>");
              inTable = true;
              if (/^\|[\s:-]+\|/.test(next)) {
                html.push(`<thead><tr>${cells.map((cell) => `<th>${cell}</th>`).join("")}</tr></thead><tbody>`);
                index += 1;
              } else {
                html.push("<tbody>");
                html.push(`<tr>${cells.map((cell) => `<td>${cell}</td>`).join("")}</tr>`);
              }
            } else {
              html.push(`<tr>${cells.map((cell) => `<td>${cell}</td>`).join("")}</tr>`);
            }
            continue;
          }

          if (/^- /.test(line)) {
            closeTable();
            if (!inList) html.push("<ul>");
            inList = true;
            html.push(`<li>${escapeHtml(line.slice(2))}</li>`);
            continue;
          }

          closeList();
          closeTable();
          html.push(`<p>${escapeHtml(line)}</p>`);
        }

        closeList();
        closeTable();
        return html.join("\n");
      }

      if (!allowed.has(file)) {
        content.innerHTML = "<h1>文档不存在</h1><p>请从方案网站的文档入口打开。</p>";
      } else {
        fetch(file)
          .then((response) => {
            if (!response.ok) throw new Error("load failed");
            return response.text();
          })
          .then((markdown) => {
            content.innerHTML = renderMarkdown(markdown);
          })
          .catch(() => {
            content.innerHTML = `<h1>无法直接渲染文档</h1><p>浏览器可能限制 file:// 页面读取本地 Markdown。可以直接打开：<a href="${file}">${file}</a></p>`;
          });
      }
    </script>
  </body>
</html>
