<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文档查看</title>
    <style>
      :root {
        --ink: #20201d;
        --muted: #68645d;
        --line: #d9d4ca;
        --paper: #f5f0e7;
        --panel: #fffdf8;
        --blue: #24566c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        border-bottom: 1px solid var(--line);
        background: rgb(245 240 231 / 92%);
        backdrop-filter: blur(16px);
      }

      .topbar-inner {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 56px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
      }

      .back:hover { background: var(--paper); }

      .doc-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .content {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 60px;
      }

      .content h1 { font-size: 28px; line-height: 1.2; margin: 0 0 20px; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
      .content h2 { font-size: 22px; line-height: 1.25; margin: 32px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
      .content h3 { font-size: 18px; margin: 24px 0 8px; }
      .content h4 { font-size: 16px; margin: 20px 0 6px; }

      .content p { margin: 0 0 14px; }

      .content ul, .content ol { margin: 0 0 14px; padding-left: 24px; }
      .content li { margin-bottom: 6px; }
      .content li > ul, .content li > ol { margin-top: 6px; margin-bottom: 0; }

      .content table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 18px;
        font-size: 14px;
      }

      .content th, .content td {
        padding: 10px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .content th {
        background: #ece4d7;
        font-weight: 600;
      }

      .content code {
        background: #ece4d7;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
      }

      .content pre {
        background: #2d2a25;
        color: #e8e0d4;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 0 0 18px;
      }

      .content pre code {
        background: none;
        padding: 0;
        color: inherit;
      }

      .content blockquote {
        margin: 0 0 14px;
        padding: 10px 16px;
        border-left: 4px solid var(--blue);
        background: var(--panel);
        border-radius: 0 6px 6px 0;
        color: var(--muted);
      }

      .content blockquote p:last-child { margin-bottom: 0; }

      .content hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 28px 0;
      }

      .content strong { color: var(--ink); }

      .content input[type="checkbox"] {
        margin-right: 6px;
        accent-color: var(--blue);
      }

      .loading {
        text-align: center;
        padding: 60px 0;
        color: var(--muted);
        font-size: 16px;
      }

      .error {
        text-align: center;
        padding: 60px 20px;
        color: #9d4035;
      }

      @media (max-width: 720px) {
        .content h1 { font-size: 22px; }
        .content h2 { font-size: 18px; }
        .content { padding: 20px 0 40px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="back" href="index.html">&larr; 返回方案</a>
        <span class="doc-title" id="docTitle"></span>
      </div>
    </header>
    <article class="content" id="content">
      <div class="loading">加载中...</div>
    </article>
    <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const file = params.get("file");
      const titles = {
        "README.md": "总任务书",
        "room-by-room-spec.md": "逐空间规格",
        "vendor-brief.md": "供应商任务书",
        "measurement-checklist.md": "复尺清单",
        "acceptance-checklist.md": "验收清单",
        "procurement-shortlist.md": "采购短清单"
      };

      if (!file || !/^[\w.-]+\.md$/i.test(file)) {
        document.getElementById("content").innerHTML = '<div class="error">未指定有效文档。<br><a href="index.html">返回方案首页</a></div>';
      } else {
        document.getElementById("docTitle").textContent = titles[file] || file;
        document.title = (titles[file] || file) + " - 239平精装轻改";
        fetch(file)
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          })
          .then(function (md) {
            document.getElementById("content").innerHTML = marked.parse(md);
          })
          .catch(function () {
            document.getElementById("content").innerHTML = '<div class="error">无法加载文档 "' + file + '"。<br><a href="index.html">返回方案首页</a></div>';
          });
      }
    </script>
  </body>
</html>
